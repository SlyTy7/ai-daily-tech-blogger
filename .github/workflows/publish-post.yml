name: Publish Blog Post

# Posts are written by a scheduled Claude Code routine that pushes
# posts/YYYY-MM-DD.md to main. This uploads new or edited posts to Firestore.
on:
  push:
    branches: [main]
    paths: ['posts/**.md']
  workflow_dispatch:
    inputs:
      files:
        description: 'Post files to (re)publish, space-separated (e.g. posts/2026-10-19.md)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find changed posts
        id: changed
        env:
          MANUAL_FILES: ${{ inputs.files }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$MANUAL_FILES" ]; then
            files="$MANUAL_FILES"
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'posts/*.md' | tr '\n' ' ')
          fi
          echo "Publishing: $files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Publish to Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/publishPost.js $FILES
